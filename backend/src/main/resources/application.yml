server:
  port: 8080
spring:
  application:
    name: careflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careflow}
    username: ${POSTGRES_USER:careflow}
    password: ${POSTGRES_PASSWORD:careflow_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: careflow-notifications
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
careflow:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:careflow}
    secret-key: ${MINIO_ROOT_PASSWORD:careflow_local_only}
    bucket: careflow-documents
  jwt:
    secret: ${JWT_SECRET:local-demo-secret-change-this-to-a-32-character-key}
    access-ttl-minutes: 15
    refresh-ttl-days: 14
springdoc:
  swagger-ui:
    path: /swagger-ui.html
